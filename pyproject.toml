[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "madrid-delivery-sim"
version = "0.1.0"
description = "Queue-driven delivery agents on Madrid's real street graph"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "psycopg[binary]>=3.2,<4",
  "redis>=5.2,<7", "osmnx>=2.0,<3", "google-genai>=2.30,<3",
  "google-adk==2.13.0", "a2a-sdk[http-server]==1.3.0",
  "opentelemetry-sdk==1.44.0", "opentelemetry-exporter-otlp-proto-http==1.44.0",
  "google-cloud-bigquery==3.46.2",
  "pydantic-settings>=2.8,<3", "numpy>=2,<2.4", "pandas>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-networkx>=3.4"]

[project.scripts]
delivery = "delivery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the dedicated Postgres test database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

