name: Verify simulation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOCAL_UID: "1001"
      LOCAL_GID: "1001"
    steps:
      - uses: actions/checkout@v4
      - name: Start local stack
        run: make setup
      - name: Typed Python and failure tests
        run: |
          docker compose exec -T -e DELIVERY_SOURCE_REVISION="$GITHUB_SHA" app python scripts/health_check.py
      - name: Full seeded day without paid calls
        run: docker compose exec -T app delivery demo --wall-seconds 0
      - name: Verify demo invariants
        run: python scripts/verify_demo.py
      - name: Inventory race, delayed supply and real worker crash
        run: docker compose exec -T app delivery lab-demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-results
          path: |
            artifacts/run-*.json
            artifacts/lab-*.json
            artifacts/health/*.json
            artifacts/health/runs/*.json
      - name: Show service logs after failure
        if: failure()
        run: docker compose logs --no-color --tail 150 app postgres redis
      - name: Stop services
        if: always()
        run: docker compose down
