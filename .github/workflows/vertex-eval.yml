name: Manual Vertex pointwise evaluation
on:
  workflow_dispatch:
    inputs:
      paid:
        description: Authorize capped paid evaluation of synthetic customer replies
        type: boolean
        required: true
        default: false
      max_cases:
        description: Maximum requests (USD 0.01 reserved each)
        type: choice
        options: ["1", "3", "5"]
        default: "3"
permissions:
  contents: read
concurrency:
  group: vertex-pointwise
  cancel-in-progress: false
jobs:
  judge:
    if: inputs.paid && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    environment: vertex-evals
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python3 -m pip install -r requirements.lock
          python3 -m pip install --no-deps -e .
      - name: Check contracts and costs without credentials
        run: python3 -m pytest -q tests/test_vertex_eval.py tests/test_eval_schema.py tests/test_eval_length.py tests/test_eval_invented_tool.py
      - name: Restore durable admission across workflow reruns
        uses: actions/cache/restore@v4
        with:
          path: artifacts/evals/vertex-ledger.sqlite
          key: vertex-eval-ledger-${{ github.run_id }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_EVAL_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_EVAL_SERVICE_ACCOUNT }}
      - name: Judge existing replies once, within the USD 0.05 reservation cap
        env:
          EVAL_PROJECT: ${{ vars.GCP_EVAL_PROJECT }}
          EVAL_CASES: ${{ inputs.max_cases }}
          EVAL_RUN: ${{ github.run_id }}
        run: |
          python3 scripts/eval_vertex.py --paid --project "$EVAL_PROJECT" --run-id "$EVAL_RUN" --max-cases "$EVAL_CASES" --max-usd 0.05
      - name: Preserve admission even after a failed request
        if: always()
        uses: actions/cache/save@v4
        with:
          path: artifacts/evals/vertex-ledger.sqlite
          key: vertex-eval-ledger-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vertex-evaluation
          path: artifacts/evals/
