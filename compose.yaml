name: madrid-delivery-sim
services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: delivery_local_only
      POSTGRES_DB: delivery
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery -d delivery"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://delivery:delivery_local_only@postgres:5432/delivery
      TEST_DATABASE_URL: postgresql://delivery:delivery_local_only@postgres:5432/delivery_test
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: ["./artifacts:/app/artifacts"]
volumes:
  postgres-data:
  redis-data:
